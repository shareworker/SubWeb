# 原样中转端点（/sub-proxy）的响应缓存；端点本身由 40-subweb-config.sh 按环境变量生成
proxy_cache_path /var/cache/nginx/subweb-proxy levels=1:2 keys_zone=subweb_proxy:10m max_size=64m inactive=60m;

server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    include /etc/nginx/conf.d/sub-proxy.inc;

    location / {
        index  index.html index.htm;
    }

    # 运行时配置由容器启动时生成，每次请求都需重新校验
    location ~ /config\.js$ {
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
